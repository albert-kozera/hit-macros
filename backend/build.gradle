// Backend trzymający pomiary tygodniowe (zakładka "Cele").
// Bez frameworka: HTTP serwuje wbudowany com.sun.net.httpserver, dane siedzą w H2.

plugins {
    id 'application'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.h2database:h2:2.2.224'
    // Gson tylko po to, żeby nie parsować JSON-a ręcznie (regexem) — wejście z frontendu.
    implementation 'com.google.code.gson:gson:2.11.0'
}

// Bez toolchainu: kompilujemy tym JDK, którym uruchomiono Gradle (17).
// Toolchain próbowałby ściągać osobny JDK, a ten projekt ma działać offline po pierwszym buildzie.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

application {
    mainClass = 'pl.hitmacros.Main'
}

// Katalog roboczy = backend/, więc baza H2 ląduje w backend/data/hitmacros.mv.db.
tasks.named('run') {
    workingDir = projectDir
}
